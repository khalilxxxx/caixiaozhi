  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "openai>=2,<3",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "reportlab>=4,<5",
  "pillow>=11,<13",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "defusedxml>=0.7.1,<1",
  "pypdfium2>=4,<6",

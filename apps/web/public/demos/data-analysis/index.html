<script>
'use strict';
const ICONS={brand:'<path d="M5 5h14M5 10h9M5 15h14M5 20h9"/><path d="m15 10 3 3 4-6"/>',chat:'<path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 3V6a2 2 0 0 1 1-2Z"/><path d="M8 9h9M8 13h6"/>',chart:'<path d="M4 3v18h17M8 16v-5M13 16V6M18 16v-8"/>',report:'<path d="M6 3h9l4 4v14H6Z"/><path d="M14 3v5h5M9 12h7M9 16h7"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',up:'<path d="M12 19V5m-6 6 6-6 6 6"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',print:'<path d="M7 8V3h10v5M7 16H4V9h16v7h-3M7 14h10v7H7Z"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',save:'<path d="M6 3h12v18l-6-4-6 4Z"/>',check:'<path d="m5 12 4 4L19 6"/>',back:'<path d="M19 12H5m6-6-6 6 6 6"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',empty:'<path d="M4 5h16v15H4Z"/><path d="M4 14h5l2 3h2l2-3h5M8 9h8"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5 8a8 8 0 0 1 13-3l2 3M4 16l2 3a8 8 0 0 0 13-3"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="white"/><circle cx="15" cy="17" r="3" fill="white"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/>',chevron:'<path d="m9 5 7 7-7 7"/>'};
function icon(n){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||ICONS.info}</svg>`}document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon));
const TYPES=['差旅','招待','办公','其他'],DEPTS=['销售','研发','行政','运营'];
const MATRICES={'10':[[140000,50000,18000,10000],[60000,10000,30000,20000],[30000,28000,16000,6000],[34000,20000,0,14000]],'09':[[110000,48000,23000,9000],[45000,8000,35000,22000],[26000,24000,14000,6000],[25000,20000,0,13000]]};
const RECORDS=Object.entries(MATRICES).flatMap(([month,m])=>m.flatMap((r,d)=>r.map((amount,t)=>({month,id:`BX-2026${month}-${String(d*4+t+1).padStart(3,'0')}`,dept:DEPTS[d],type:TYPES[t],amount,date:`2026-${month}-${String(5+d*5+t).padStart(2,'0')}`})).filter(r=>r.amount>0)));
const DEFAULT=Object.freeze({month:'10',dept:'全部部门',type:null});let context={...DEFAULT},cardSequence=1,cards=[{id:1,q:'10月集团报销费用是多少？比上个月变化大吗？',scope:{...DEFAULT},focus:'overview'}],panel=null,panelTab='overview',panelView='chart',panelFilter={},returnFocus=null,route='chat',workScope={...DEFAULT},workTab='query',workDim='type',workView='chart',workState='normal',settingsOpen=false,plan=null,job=null,reportScope={...DEFAULT},reportOrigin='chat',reportAskOpen=true,reportReply='',saved=[],memoryOnly=false,reportItems=[{id:'sample',scope:{...DEFAULT},created:'预置示例 · 11-02 08:00'}],toastTimer;
try{let loaded=JSON.parse(localStorage.getItem('cxz-local-queries-v2')||'[]');if(Array.isArray(loaded))saved=loaded.filter(x=>['09','10'].includes(x.month)&&['全部部门',...DEPTS].includes(x.dept)&&(!x.type||TYPES.includes(x.type)));}catch(e){memoryOnly=true}
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),wan=n=>(n/10000).toFixed(2),roundPercent=n=>n.toFixed(1),sum=rs=>rs.reduce((a,r)=>a+r.amount,0);
function scopeName(s){return `2026年${Number(s.month)}月 · ${s.dept==='全部部门'?'全集团':s.dept+'部'}${s.type?' · '+s.type:''}`}
function getRows(s,filter={}){return RECORDS.filter(r=>r.month===s.month&&(s.dept==='全部部门'||r.dept===s.dept)&&(!s.type||r.type===s.type)&&(!filter.dept||r.dept===filter.dept)&&(!filter.type||r.type===filter.type))}
function total(s){return sum(getRows(s))}function previous(s){return s.month==='10'?{...s,month:'09'}:null}function comparison(s){let p=previous(s);if(!p)return null;let now=total(s),old=total(p);return {old,now,diff:now-old,percent:old?(now-old)/old*100:null}}
function isGroup(s){return s.month==='10'&&s.dept==='全部部门'&&!s.type}function cats(s,dim){let ns=dim==='dept'?DEPTS:TYPES;return ns.map(name=>({name,value:sum(getRows(s).filter(r=>r[dim]===name))})).filter(x=>dim==='dept'?s.dept==='全部部门'||s.dept===x.name:!s.type||s.type===x.name)}
function sorted(s,dim){return cats(s,dim).sort((a,b)=>b.value-a.value)}function pctText(c){return c&&c.percent!==null?(c.percent>=0?'+':'')+roundPercent(c.percent)+'%':'无可比上期'}
function summary(s,focus){let c=comparison(s),amount=total(s);if(focus==='growth'){if(!c)return '9月没有8月比较数据，暂不能分析环比增长。';if(isGroup(s))return '差旅增加5.80万元，贡献全部净增额；业务原因待核实。';let changes=cats(s,'type').map(x=>({...x,diff:x.value-sum(getRows(previous(s)).filter(r=>r.type===x.name))})).sort((a,b)=>b.diff-a.diff);return `${changes[0].name}变化${changes[0].diff>=0?'+':''}${wan(changes[0].diff)}万元；金额变化不代表业务原因。`}if(focus==='dept'){let top=sorted(s,'dept')[0];return `${top.name}部费用${wan(top.value)}万元，占当前范围${roundPercent(amount?top.value/amount*100:0)}%。`}if(s.type)return `${s.type}费用${c?`较9月${c.diff>=0?'增加':'减少'}${wan(Math.abs(c.diff))}万元`:'按审批完成日汇总，暂无上月比较'}。`;return c?`较9月${c.diff>=0?'增加':'减少'}${wan(Math.abs(c.diff))}万元${isGroup(s)?'，净增额全部来自差旅':'，可继续查看费用结构'}。`:'9月费用已汇总，未提供8月数据，不计算环比。'}
function titleFor(c){return c.focus==='dept'?'部门费用分布':c.focus==='growth'?'费用变化分析':c.scope.type?c.scope.type+'费用概览':'已完成报销费用'}
function toast(msg){clearTimeout(toastTimer);document.getElementById('toast-root').innerHTML=`<div class="toast" role="status">${escape(msg)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',3500)}
function nav(r){if(location.hash==='#'+r)render();else location.hash=r}
function render(){route=['chat','workspace','report'].includes(location.hash.slice(1))?location.hash.slice(1):'chat';document.querySelectorAll('[data-route]').forEach(n=>n.classList.toggle('active',n.dataset.route===(route==='report'?'workspace':route)));document.getElementById('page-label').textContent={chat:'财务助手',workspace:'数据分析',report:'费用分析报告'}[route];document.title=document.getElementById('page-label').textContent+' · 财小智';document.getElementById('main').innerHTML=route==='chat'?chatPage():route==='workspace'?workspacePage():reportPage();if(route==='chat')paintTask();renderSettings()}
function chatPage(){return `<div class="chat-split ${panel?'panel-open':''}"><section class="chat-main"><div class="chat-heading"><h1>费用分析</h1><button class="ghost" data-action="reset">${icon('refresh')}恢复示例</button></div><div id="messages">${cards.map(cardHTML).join('')}</div><div id="task-slot"></div><form class="composer" id="chat-form"><div class="composer-line"><input id="chat-input" aria-label="继续提问" placeholder="继续提问，例如：只看销售部"><button class="primary send" aria-label="发送问题" type="submit">${icon('up')}</button></div><div class="composer-meta"><span class="context-pill">${icon('chart')}当前范围：${scopeName(context)}</span></div></form></section>${panel?panelHTML():''}</div>`}
function suggestionsFor(c){return [c.scope.dept==='全部部门'?(c.focus==='dept'?'只看销售部':'按部门看'):'查看全集团',c.scope.month==='09'?'换成10月':c.focus==='growth'?'换成9月':'分析增长',c.scope.type?'查看全部费用':'查看差旅']}
function cardHTML(c,i){if(c.notice)return `<article class="message"><div class="user-line"><div class="user-bubble">${escape(c.q)}</div></div><div class="answer-line"><span class="assistant-mark">${icon('brand')}</span><p>${c.notice}</p></div></article>`;let s=c.scope,comp=comparison(s);return `<article class="message" data-message-id="${c.id}"><div class="user-line"><div class="user-bubble">${escape(c.q)}</div></div><div class="answer-line"><span class="assistant-mark">${icon('brand')}</span><p>${c.focus==='growth'?'已把变化按费用类型拆开。':c.focus==='dept'?'按当前范围拆分到了各部门。':s.type?'已保留当前期间和部门，只看'+s.type+'费用。':i===0?'10月费用有所增长，主要变化集中在差旅。':'已按新的范围整理好费用。'}</p></div><div class="result-card" data-testid="result-card" data-card-id="${c.id}"><div class="result-top"><strong>${titleFor(c)}</strong><span>${scopeName(s)}</span></div><div class="result-numbers"><span class="big-number">${wan(total(s))}<small>万元</small></span><span class="delta">${comp?'较9月 <strong>'+pctText(comp)+'</strong>':'环比 — <span>缺少8月数据</span>'}</span></div><p class="result-note">${summary(s,c.focus)}</p><div class="result-footer"><button class="primary" data-action="open-panel" data-card="${c.id}">查看分析 ${icon('arrow')}</button><button class="text" data-action="plan-card" data-card="${c.id}">生成报告</button><span class="meta">按审批完成日</span></div></div>${i===cards.length-1?'<div class="suggestions">'+suggestionsFor(c).map(q=>'<button data-action="quick" data-value="'+q+'">'+q+' '+icon('chevron')+'</button>').join('')+'</div>':''}</article>`}
function parseIntent(q,base){let n=q.trim().replace(/[\s？?！!。]/g,''),s={...base},focus='overview';if(/^(生成|制作|做一份|生成完整|生成一份)(费用分析)?报告$/.test(n)||n==='生成报告')return {intent:'report',scope:s};if(['按部门看','按部门看看','按部门查看','看看部门分布','部门排行'].includes(n))return {scope:s,focus:'dept'};if(['分析增长','增长来自哪里','为什么增长','分析费用增长','看看增长原因'].includes(n))return {scope:s,focus:'growth'};if(['查看差旅','看差旅','只看差旅','看看差旅费用','查看差旅费用'].includes(n))return {scope:{...s,type:'差旅'},focus:'travel'};if(['查看全部费用','所有费用','取消费用类型筛选'].includes(n))return {scope:{...s,type:null},focus:'overview'};let dept=n.match(/^(?:只看|看一下|查看|看|切换到)(销售|研发|行政|运营)(?:部|部门)?(?:费用)?$/);if(dept)return {scope:{...s,dept:dept[1]},focus:s.type?'travel':'overview'};if(['只看集团','查看全集团','全部部门','看全部部门'].includes(n))return {scope:{...s,dept:'全部部门'},focus:s.type?'travel':'overview'};let mon=n.match(/^(?:换成|切换到|改成|看一下|查看)(9|09|10)月$/);if(mon)return {scope:{...s,month:mon[1]==='10'?'10':'09'},focus:s.type?'travel':'overview'};let direct=n.match(/^(9|09|10)月(集团|全集团|销售部|研发部|行政部|运营部)(费用|报销费用|费用概览|费用结构|部门排行|差旅费用)$/);if(direct)return {scope:{month:direct[1]==='10'?'10':'09',dept:['集团','全集团'].includes(direct[2])?'全部部门':direct[2].slice(0,-1),type:direct[3]==='差旅费用'?'差旅':null},focus:direct[3]==='部门排行'?'dept':direct[3]==='差旅费用'?'travel':'overview'};return null}
function appendCard(q,s,focus='overview'){context={...s};cards.push({id:++cardSequence,q,scope:{...s},focus});render();document.getElementById('messages')?.lastElementChild?.scrollIntoView({behavior:'smooth',block:'nearest'})}
function ask(q){q=q.trim();if(!q)return;let p=parseIntent(q,context);if(!p){cards.push({id:++cardSequence,q,notice:'这个本地原型只支持指定演示问题，未连接模型。可以说「只看销售部」「换成9月」「按部门看」「查看差旅」「分析增长」或「生成报告」。当前范围未改变。'});render();return}if(p.intent==='report'){startPlan(p.scope,'overview','chat');return}appendCard(q,p.scope,p.focus)}
function graph(s,dim='type',rank=false,target='panel'){let ds=rank?sorted(s,dim):cats(s,dim),max=Math.ceil(Math.max(...ds.map(x=>x.value),1)/50000)*50000,h=ds.length*47+32;return `<svg class="chart" viewBox="0 0 480 ${h}" role="img" aria-label="${scopeName(s)}，按${dim==='dept'?'部门':'费用类型'}统计，单位万元">${[0,max/2,max].map(t=>`<line x1="${74+t/max*330}" x2="${74+t/max*330}" y1="2" y2="${h-26}" stroke="#edf0f1"/><text x="${74+t/max*330}" y="${h-7}" text-anchor="middle" font-size="12" fill="#74828b">${(t/10000).toFixed(t%10000?1:0)}</text>`).join('')}${ds.map((d,i)=>`<g class="chart-hit" tabindex="0" role="button" data-action="drill" data-target="${target}" data-dim="${dim}" data-name="${d.name}" aria-label="查看${d.name}明细 ${wan(d.value)}万元"><title>${d.name} ${wan(d.value)}万元</title><rect x="0" y="${i*47}" width="480" height="44" fill="transparent"/><text x="0" y="${i*47+27}" font-size="13" fill="#516976">${d.name}${dim==='dept'?'部':''}</text><rect class="data-bar" x="74" y="${i*47+10}" width="${d.value/max*330}" height="24" rx="3" fill="${i===0?'#397d6d':'#94b0ac'}"/><text x="${82+d.value/max*330}" y="${i*47+27}" font-size="13" fill="#3c5663">${wan(d.value)}</text></g>`).join('')}</svg>`}
function categoryTable(s,dim,target='panel'){let ds=cats(s,dim);return `<table class="data-table"><thead><tr><th>${dim==='dept'?'部门':'费用类型'}</th><th>占比</th><th>金额（万元）</th></tr></thead><tbody>${ds.map(x=>`<tr><td><button data-action="drill" data-target="${target}" data-dim="${dim}" data-name="${x.name}">${x.name}${dim==='dept'?'部':''}</button></td><td>${roundPercent(total(s)?x.value/total(s)*100:0)}%</td><td>${wan(x.value)}</td></tr>`).join('')}</tbody><tfoot><tr><td>合计</td><td>${total(s)?'100.0%':'—'}</td><td>${wan(total(s))}</td></tr></tfoot></table>`}
function metricStrip(s,includeBudget=false){let c=comparison(s);return `<div class="metric-strip"><div class="strip-metric"><div class="label">已完成报销费用</div><strong>${wan(total(s))}<small>万元</small></strong><div class="sub">审批完成口径</div></div><div class="strip-metric"><div class="label">${c?'较9月变化':'上期比较'}</div><strong>${c?(c.diff>=0?'+':'')+wan(c.diff):'—'}<small>${c?'万元':''}</small></strong><div class="sub">${c?'环比 '+pctText(c):'未提供8月比较数据'}</div></div>${includeBudget&&isGroup(s)?'<div class="strip-metric"><div class="label">预算执行率</div><strong>81.0<small>%</small></strong><div class="sub">模拟预算60.00万元</div></div>':''}</div>`}
function changes(s){if(!previous(s))return [];return cats(s,'type').map(x=>({...x,before:sum(getRows(previous(s)).filter(r=>r.type===x.name)),diff:x.value-sum(getRows(previous(s)).filter(r=>r.type===x.name))}))}
function comparisonChart(s,target='panel'){if(!previous(s))return '<div class="hint">9月未提供8月比较数据，不能计算环比或变化贡献。</div>';let ds=changes(s),max=Math.max(...ds.flatMap(x=>[x.value,x.before]),1);return `<div class="legend"><span><i style="background:#bbcbd0"></i>9月</span><span><i style="background:#478476"></i>10月</span><span>单位：万元</span></div>${ds.map(x=>`<div class="comparison-row"><button class="text small" data-action="drill" data-target="${target}" data-dim="type" data-name="${x.name}">${x.name}</button><div class="comparison-bars"><div class="comparison-bar" style="width:${x.before/max*100}%"><span>${wan(x.before)}</span></div><div class="comparison-bar now" style="width:${x.value/max*100}%"><span>${wan(x.value)}</span></div></div><span class="change">${x.diff>0?'+':''}${wan(x.diff)}</span></div>`).join('')}`}
function comparisonTable(s,target='panel'){if(!previous(s))return '<div class="hint">9月没有8月比较数据。</div>';return `<table class="data-table"><thead><tr><th>费用类型</th><th>9月（万元）</th><th>10月（万元）</th><th>变化（万元）</th></tr></thead><tbody>${changes(s).map(x=>`<tr><td><button data-action="drill" data-target="${target}" data-dim="type" data-name="${x.name}">${x.name}</button></td><td>${wan(x.before)}</td><td>${wan(x.value)}</td><td>${x.diff>0?'+':''}${wan(x.diff)}</td></tr>`).join('')}</tbody><tfoot><tr><td>合计</td><td>${wan(comparison(s).old)}</td><td>${wan(total(s))}</td><td>${wan(comparison(s).diff)}</td></tr></tfoot></table>`}
function contribution(s){let ds=changes(s),comp=comparison(s);if(!comp)return '';let max=Math.max(...ds.map(x=>Math.abs(x.diff)),1),scale=38/max;return ds.map(x=>`<div class="contribution-row"><span>${x.name}</span><div class="contribution-track" style="background:linear-gradient(to right,transparent 44.8%,#dbe3e5 44.8%,#dbe3e5 45.2%,transparent 45.2%)"><div class="contribution-bar ${x.diff<0?'negative':''}" style="left:${x.diff<0?45-Math.abs(x.diff)*scale:45}%;width:${Math.abs(x.diff)*scale}%"></div><span style="position:absolute;top:1px;left:${x.diff<0?47:47+Math.abs(x.diff)*scale}%;font-size:12px;white-space:nowrap">${x.diff>0?'+':''}${wan(x.diff)}</span></div><span style="text-align:right">${comp.diff?roundPercent(x.diff/comp.diff*100)+'%':'不适用'}</span></div>`).join('')}
function panelHTML(){let s=panel.scope,dim=panel.focus==='dept'?'dept':'type',growth=panel.focus==='growth';return `<aside class="analysis-panel" aria-label="费用分析面板" data-testid="analysis-panel"><header class="panel-head"><div class="panel-title"><h2>${titleFor(panel)}</h2><button class="ghost icon-button" data-action="close-panel" aria-label="关闭分析面板">${icon('close')}</button></div><div class="panel-subtitle">${scopeName(s)}</div></header><nav class="tabs panel-tabs" aria-label="分析面板栏目"><button class="${panelTab==='overview'?'active':''}" data-action="panel-tab" data-value="overview">概览</button><button class="${panelTab==='details'?'active':''}" data-action="panel-tab" data-value="details">明细</button><button class="${panelTab==='basis'?'active':''}" data-action="panel-tab" data-value="basis">口径</button></nav><div class="panel-body">${panelTab==='overview'?`${metricStrip(s)}<div class="section-head"><h3>${growth?'9月与10月费用比较':dim==='dept'?'部门费用分布':'费用类型分布'}</h3><div class="segmented"><button data-action="panel-view" data-value="chart" class="${panelView==='chart'?'selected':''}">图表</button><button data-action="panel-view" data-value="table" class="${panelView==='table'?'selected':''}">表格</button></div></div>${growth?(panelView==='chart'?comparisonChart(s):comparisonTable(s)):(panelView==='chart'?graph(s,dim,dim==='dept'):categoryTable(s,dim))}<div class="chart-caption"><span>单位：万元 · 点击查看明细</span></div>${growth&&previous(s)?`<div class="section-head" style="margin-top:22px"><h3>净增额贡献</h3><span class="muted small">金额 / 贡献度</span></div>${contribution(s)}`:''}<div class="panel-insight"><strong>${summary(s,panel.focus)}</strong>${growth?'<br>贡献只分解金额变化，出差频次、单次成本或集中报销等原因仍需核实。':''}</div><div class="panel-actions"><button class="ghost" data-action="panel-tab" data-value="basis">${icon('info')}口径与来源</button><button class="ghost" data-action="csv-panel">${icon('download')}导出数据</button></div>`:panelTab==='details'?detailsHTML(s):basisHTML(s)}</div></aside>`}
function detailsHTML(s){let rs=getRows(s,panelFilter),filter=panelFilter.type||panelFilter.dept&&panelFilter.dept+'部';return `<div class="detail-scope"><span>${filter?'筛选：'+filter:'全部明细'} · ${rs.length}条 · ${wan(sum(rs))}万元</span>${filter?'<button class="text small" data-action="clear-drill">清除下钻</button>':''}</div><div class="table-scroll"><table class="data-table"><thead><tr><th>模拟单据</th><th>部门 / 类型</th><th>审批完成日</th><th>万元</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${r.id.slice(3)}</td><td>${r.dept} / ${r.type}</td><td>${r.date.slice(5)}</td><td>${wan(r.amount)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">合计</td><td>${wan(sum(rs))}</td></tr></tfoot></table></div><p class="small-note">每条记录是合成样本；金额以整数元汇总，图表、明细与CSV共用这些记录。</p><div class="panel-actions"><button class="ghost small" data-action="panel-tab" data-value="overview">${icon('back')}返回概览</button><button class="primary small" data-action="csv-panel">${icon('download')}下载当前明细</button></div>`}
function monthOptions(s){return `<option value="10" ${s.month==='10'?'selected':''}>2026年10月</option><option value="09" ${s.month==='09'?'selected':''}>2026年9月</option>`}function deptOptions(s){return ['全部部门',...DEPTS].map(d=>`<option value="${d}" ${s.dept===d?'selected':''}>${d==='全部部门'?d:d+'部'}</option>`).join('')}
function basisHTML(s){return `<section class="basis"><dl><dt>统计范围</dt><dd>${scopeName(s)}</dd><dt>金额定义</dt><dd>审批已完成的报销费用，人民币、含税；不代表付款金额。</dd><dt>时间口径</dt><dd>按审批完成日归属月份，整月比较。</dd><dt>比较期</dt><dd>${previous(s)?'2026年9月，同部门、同费用类型；环比不是同比。':'未提供2026年8月数据，不计算环比。'}</dd><dt>数据来源</dt><dd>财小智报销记录 · 合成模拟数据。</dd><dt>快照时间</dt><dd>2026-11-02 08:00，未连接实时系统。</dd><dt>预算假设</dt><dd>仅集团10月预算60.00万元，执行率81.0%，余额11.40万元；均为模拟同口径，正式指标待业务确认。</dd><dt>使用边界</dt><dd>没有付款状态、费用发生日、业务量、去年同期；不据此推断业务原因。</dd></dl></section><section class="range-form"><h3>换一个范围继续分析</h3><div class="filter-row"><label>月份<select id="panel-month">${monthOptions(s)}</select></label><label>部门<select id="panel-dept">${deptOptions(s)}</select></label></div><p class="small-note">${s.type?'保留“'+s.type+'”费用类型筛选。':''}应用后生成新答案，原卡片保持不变。</p><button class="primary small" data-action="apply-panel-scope" style="margin-top:12px">应用并生成新答案 ${icon('arrow')}</button></section>`}
function openPanel(card,tab='overview',filter={}){returnFocus=document.activeElement;panel={...card,scope:{...card.scope}};panelTab=tab;panelFilter={...filter};panelView='chart';render();document.querySelector('[data-action="close-panel"]')?.focus()}
function closePanel(){let cardId=panel?.id;panel=null;render();let target=cardId?document.querySelector(`[data-action="open-panel"][data-card="${cardId}"]`):null;(target||document.getElementById('chat-input'))?.focus()}
function startPlan(s,focus='overview',origin='chat'){if(job?.status==='running'){nav('chat');toast('已有报告正在生成，可等待完成或先取消。');return}plan={scope:{...s},focus,origin};if(origin==='workspace'){context={...s}}nav('chat');setTimeout(()=>document.getElementById('task-slot')?.scrollIntoView({behavior:'smooth',block:'nearest'}),40)}
function paintTask(){let slot=document.getElementById('task-slot');if(!slot)return;if(plan){slot.innerHTML=`<section class="task-card" data-testid="task-card"><div class="task-head"><strong>生成费用分析报告</strong><span class="muted">${scopeName(plan.scope)}</span></div><div class="plan-sections"><span><b>01</b>总体表现</span><span><b>02</b>结构与变化</span><span><b>03</b>待验证原因</span><span><b>04</b>建议与依据</span></div><div class="actions"><button class="primary" data-action="start-job">开始生成</button><button class="ghost" data-action="dismiss-plan">取消</button></div></section>`;return}if(!job){slot.innerHTML='';return}if(job.status==='running'){let index=Math.min(3,Math.floor((Date.now()-job.start)/1600));slot.innerHTML=`<section class="task-card" data-testid="task-card" aria-live="polite"><div class="task-head"><strong>正在生成报告</strong><button class="text small" data-action="cancel-job">取消</button></div><div class="progress-steps">${['核对','比较','整理','完成'].map((t,i)=>`<span class="progress-step ${i<index?'done':i===index?'current':''}">${t}${i<index?' · 已完成':i===index?' · 进行中':''}</span>`).join('')}</div></section>`}else if(job.status==='cancelled'){slot.innerHTML=`<section class="task-card" data-testid="task-card"><div class="task-head"><strong>报告生成已取消</strong><button class="text" data-action="retry-job">重新生成</button></div><p>${scopeName(job.scope)} · 范围已保留</p></section>`}else{slot.innerHTML=`<section class="task-card report-card" data-testid="report-card"><div class="task-head"><strong>费用分析报告已完成</strong><span class="muted">${scopeName(job.scope)}</span></div><div class="findings"><span>本期费用 ${wan(total(job.scope))}万元</span><span>${summary(job.scope,'growth')}</span></div><button class="primary" data-action="open-job-report">查看报告 ${icon('arrow')}</button></section>`}}
function beginJob(){if(!plan)return;job={scope:{...plan.scope},focus:plan.focus,origin:plan.origin,status:'running',start:Date.now()};plan=null;paintTask()}
function retryJob(){if(!job||job.status!=='cancelled')return;job.status='running';job.start=Date.now();paintTask()}
function cancelJob(){if(job?.status==='running'){job.status='cancelled';paintTask()}}
function advanceJob(now=Date.now()){if(job?.status==='running'){if(now-job.start>=6500){job.status='done';let id='report-'+now;job.reportId=id;reportItems.unshift({id,scope:{...job.scope},created:'本次生成 · '+new Date(now).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});if(route==='workspace')render();if(route!=='chat')toast('报告已完成，可在数据分析的报告列表查看。')}if(route==='chat')paintTask()}}
setInterval(advanceJob,400);
function workspacePage(){return `<div class="workspace"><div class="page-head"><div><h1>数据分析</h1><p>费用查询与报告</p></div><button class="ghost small" data-action="workspace-reset">恢复默认范围</button></div><form class="workspace-query" id="workspace-form"><div class="workspace-input">${icon('search')}<input id="workspace-input" aria-label="输入费用查询" placeholder="例如：10月销售部费用结构"></div><select id="work-month" aria-label="月份">${monthOptions(workScope)}</select><select id="work-dept" aria-label="部门">${deptOptions(workScope)}</select><button class="primary" type="submit">查询</button></form><div class="workspace-tabs"><nav class="tabs"><button data-action="workspace-tab" data-value="query" class="${workTab==='query'?'active':''}">查询</button><button data-action="workspace-tab" data-value="reports" class="${workTab==='reports'?'active':''}">报告 <span class="muted small">${reportItems.length}</span></button></nav>${workTab==='query'&&workState==='normal'?'<button class="ghost small" data-action="save-query">'+icon('save')+'保存查询</button>':''}</div>${workTab==='reports'?reportsList():workState!=='normal'?stateHTML():workResults()}${workTab==='query'?savedHTML():''}</div>`}
function workResults(){let s=workScope;return `<div class="query-topline"><span>${scopeName(s)} · 已完成报销费用</span><span>快照 11-02 08:00</span></div><section class="work-results" data-testid="workspace-results">${metricStrip(s,true)}<div class="work-chart-grid"><div><div class="section-head"><div class="tabs"><button data-action="work-dim" data-value="type" class="${workDim==='type'?'active':''}" style="padding:0 0 5px">费用类型</button><button data-action="work-dim" data-value="dept" class="${workDim==='dept'?'active':''}" style="padding:0 0 5px">部门</button></div><div class="segmented"><button data-action="work-view" data-value="chart" class="${workView==='chart'?'selected':''}">图表</button><button data-action="work-view" data-value="table" class="${workView==='table'?'selected':''}">表格</button></div></div>${workView==='chart'?graph(s,workDim,workDim==='dept','work'):categoryTable(s,workDim,'work')}<div class="chart-caption"><span>单位：万元 · 点击查看明细</span><button class="text small" data-action="work-basis">口径</button></div></div><aside class="work-notes"><h3>${s.dept==='全部部门'?'部门排行':'费用类型排行'}</h3><div class="rankings">${sorted(s,s.dept==='全部部门'?'dept':'type').map((x,i)=>`<div class="ranking-row"><span><span class="muted" style="margin-right:10px">${i+1}</span><button data-action="drill" data-target="work" data-dim="${s.dept==='全部部门'?'dept':'type'}" data-name="${x.name}">${x.name}${s.dept==='全部部门'?'部':''}</button></span><span>${wan(x.value)}</span></div>`).join('')}</div><p>${summary(s,'growth')}<br>${previous(s)?'比较相同部门与费用类型的整月数据。':'需要8月数据后才能判断增长。'}</p></aside></div><div class="work-actions"><button class="ghost" data-action="csv-work">${icon('download')}下载数据</button><div class="actions"><button data-action="continue-chat">${icon('chat')}继续对话</button><button class="primary" data-action="work-report">生成报告 ${icon('arrow')}</button></div></div></section>`}
function reportsList(){return `<div class="reports-list">${reportItems.map(r=>`<div class="report-row"><div><h3>${Number(r.scope.month)}月${r.scope.dept==='全部部门'?'集团':r.scope.dept+'部'}${r.scope.type||'费用'}分析报告</h3><p>${scopeName(r.scope)} · ${wan(total(r.scope))}万元</p></div><span class="muted">${r.created}</span><button data-action="open-report-item" data-id="${r.id}">查看 ${icon('arrow')}</button></div>`).join('')}</div>`}
function savedHTML(){return `<div class="saved-queries"><span>常用查询</span><span class="saved-query"><button data-action="preset-query">10月集团费用</button></span>${saved.map((s,i)=>`<span class="saved-query"><button data-action="load-query" data-index="${i}">${Number(s.month)}月${s.dept==='全部部门'?'集团':s.dept+'部'}${s.type||'费用'}</button><button data-action="remove-query" data-index="${i}" aria-label="移除此查询">${icon('close')}</button></span>`).join('')}${memoryOnly?'<span>仅本次打开期间保留</span>':''}</div>`}
function stateHTML(){let x={empty:['empty','没有符合条件的记录','这是无记录演示，不代表真实业务结果。'],error:['refresh','数据暂不可用','当前演示未展示缓存数据。'],denied:['lock','当前角色无查询权限','此状态不显示统计金额、图表或明细。']}[workState];return `<div class="work-results empty-state">${icon(x[0])}<h3>${x[1]}</h3><p>${x[2]}</p><button class="primary" data-action="restore-work">${workState==='error'?'恢复并重试':'恢复正常演示'}</button></div>`}
function renderSettings(){document.getElementById('settings-slot').innerHTML=settingsOpen?`<section class="settings"><p>本地交互原型，未连接模型或业务系统。报告生成由浏览器模拟；切换页面可继续，刷新后会重置。常用查询优先保存在本机浏览器。</p><label for="demo-state">工作台查询状态</label><select id="demo-state"><option value="normal" ${workState==='normal'?'selected':''}>正常</option><option value="empty" ${workState==='empty'?'selected':''}>无记录</option><option value="error" ${workState==='error'?'selected':''}>数据暂不可用</option><option value="denied" ${workState==='denied'?'selected':''}>无权限</option></select><p style="margin:10px 0 0">状态仅作用于工作台查询区域。</p></section>`:''}
function saveQuery(){if(workState!=='normal')return;if(saved.some(s=>s.month===workScope.month&&s.dept===workScope.dept&&s.type===workScope.type)){toast('这个范围已保存在常用查询中。');return}saved.unshift({...workScope});persist();render();toast(memoryOnly?'已保存，仅本次打开期间可用。':'已保存到常用查询。')}
function persist(){try{localStorage.setItem('cxz-local-queries-v2',JSON.stringify(saved))}catch(e){memoryOnly=true}}
function reportPage(){let s=reportScope,c=comparison(s);return `<div class="report-toolbar"><div class="actions"><button class="ghost" data-action="back-report">${icon('back')}${reportOrigin==='workspace'?'返回报告列表':'返回对话'}</button><span class="tag">专题报告</span></div><div class="actions"><button data-action="csv-report">${icon('download')}数据CSV</button><button data-action="print">${icon('print')}打印</button><button data-action="toggle-report-ask">${reportAskOpen?'收起':'展开'}追问</button></div></div><div class="report-layout ${reportAskOpen?'':'collapsed'}"><article class="report-document"><header class="report-cover"><div class="meta"><span>财小智 · 费用分析</span><span>快照 2026-11-02 08:00</span></div><h1>${Number(s.month)}月${s.dept==='全部部门'?'集团':s.dept+'部'}${s.type||'费用'}分析报告</h1><p>${scopeName(s)} · 人民币含税 · 按审批完成日</p></header><nav class="report-toc"><a href="#report" data-action="scroll" data-to="report-summary">摘要</a><a href="#report" data-action="scroll" data-to="report-structure">结构与变化</a><a href="#report" data-action="scroll" data-to="report-explanation">待验证解释</a><a href="#report" data-action="scroll" data-to="report-actions">建议与依据</a></nav><section class="report-section" id="report-summary"><h2><span class="section-num">01</span>分析摘要</h2><p class="report-summary">本期已完成报销费用 <strong>${wan(total(s))}万元</strong>${c?`，较9月${c.diff>=0?'增加':'减少'} <strong>${wan(Math.abs(c.diff))}万元（${pctText(c)}）</strong>`:'，未提供8月数据，因此不计算环比变化'}。${isGroup(s)?'<a href="#report" data-action="scroll" data-to="report-contribution">差旅贡献全部净增额</a>，招待增加与办公减少相互抵消。':summary(s,c?'growth':'overview')}${isGroup(s)?' 当前预算执行率81.0%，剩余11.40万元，预算数为模拟展示假设。':''}</p>${metricStrip(s,isGroup(s))}</section><section class="report-section" id="report-structure"><div class="section-head"><h2 style="margin:0"><span class="section-num">02</span>${c?'费用结构与两月比较':'本期费用结构'}</h2><button class="text small" data-action="report-details">查看明细 ${icon('arrow')}</button></div>${c?comparisonChart(s,'report'):graph(s,'type',false,'report')}<p class="small-note">${c?'9月与10月均按审批完成日整月统计，保持部门和费用类型一致。':'9月没有8月比较数据；缺失值不视为零。'}</p></section>${c?`<section class="report-section" id="report-contribution"><div class="section-head"><h2 style="margin:0">变化贡献</h2><span class="small muted">变化（万元） / 占净增额</span></div>${contribution(s)}<p class="small-note">贡献度 = 各类费用变化 ÷ 当前范围净增额${wan(c.diff)}万元。${isGroup(s)?'差旅 +5.80；招待 +0.80、办公 −0.80相互抵消；其他不变。':''}<br>这是金额分解，不是业务因果判断。</p></section>`:''}<section class="report-section" id="report-explanation"><h2><span class="section-num">03</span>待验证的业务解释</h2><div class="explanation"><div><h3>业务活动与单次成本</h3><p>补充出差次数、人数、目的地及单次费用，再判断业务量或费用水平是否变化。</p></div><div><h3>跨期集中报销</h3><p>对照费用发生日与审批完成日，核实是否有以前月份的单据在本期集中完成。</p></div></div><div class="hint" style="margin-top:14px">上述均为待核实假设。当前记录不足以得出“成本失控”或“业务扩张导致增长”等结论。</div></section><section class="report-section" id="report-actions"><h2><span class="section-num">04</span>行动建议</h2><div class="action-row"><span class="num">01</span><div><strong>核对重点费用明细与时间归属</strong><p>财务分析师核实金额、部门、费用类型与审批完成时间。</p><button class="text small" data-action="report-details">打开对应明细 ${icon('arrow')}</button></div></div><div class="action-row"><span class="num">02</span><div><strong>补充业务活动与费用发生日</strong><p>业务负责人核对出差次数、人数和发生日期，用证据验证变化原因。</p></div></div><div class="action-row"><span class="num">03</span><div><strong>${isGroup(s)?'结合在途支出评估预算余量':'补齐比较期与预算后继续分析'}</strong><p>${isGroup(s)?'11.40万元余额未扣审批中与未报销支出，不等于可自由支用额度。':'当前范围未提供预算'+(!c?'及8月比较数据':'')+'，不以零值代替。'}</p></div></div></section><section class="report-section"><h2>数据依据</h2><div class="evidence"><dl><dt>定义</dt><dd>已完成审批的报销费用，不是付款金额；人民币、含税。</dd><dt>范围</dt><dd>${scopeName(s)}；按审批完成日归属月份，整月比较。</dd><dt>来源</dt><dd>财小智合成模拟记录，快照截至2026-11-02 08:00。</dd><dt>预算</dt><dd>仅集团10月预算60.00万元为模拟同口径假设，正式指标待业务确认。</dd><dt>限制</dt><dd>未提供费用发生日、付款状态、业务量及去年同期。不连接实时系统。</dd></dl></div></section><footer class="report-footer"><span>财小智 · 本地概念评审版</span><span>全部数据为模拟</span></footer></article>${reportAskOpen?`<aside class="report-ask"><h3>围绕这份报告追问</h3><p>${scopeName(s)}</p><div class="quick"><button data-action="report-question" data-value="增长来自哪里">${c?'增长来自哪里？':'能分析环比吗？'} ${icon('chevron')}</button><button data-action="report-question" data-value="预算还有多少">预算还有多少？ ${icon('chevron')}</button><button data-action="report-question" data-value="这是付款额吗">这是付款额吗？ ${icon('chevron')}</button></div><form id="report-form"><input id="report-input" aria-label="围绕报告追问" placeholder="输入上方示例问题"><button class="primary" type="submit">回答</button></form>${reportReply?`<div class="report-answer" aria-live="polite">${reportReply}</div>`:''}</aside>`:''}</div>`}
function reportAnswer(q){let n=q.trim().replace(/[\s？?。]/g,''),s=reportScope,c=comparison(s);if(['增长来自哪里','能分析环比吗','分析增长','为什么差旅贡献100%'].includes(n)){return summary(s,'growth')+(isGroup(s)?' 招待增加0.80万元、办公减少0.80万元相互抵消。':'')+'<p>这里只解释金额变化，业务原因仍需补充证据。</p>'}if(['预算还有多少','剩余预算是多少'].includes(n))return isGroup(s)?'模拟预算60.00万元，已完成报销48.60万元，执行率81.0%，余额11.40万元。<p>预算为模拟展示假设，未包含在途支出，正式指标待业务确认。</p>':'当前范围没有提供预算数据，不能计算余额或执行率。';if(['这是付款额吗','这是不是付款额','口径是什么'].includes(n))return '这是审批已完成的报销费用，不代表付款金额。按审批完成日统计，人民币、含税，快照截至2026-11-02 08:00。';return '此原型未连接模型。报告追问仅支持「增长来自哪里」「预算还有多少」「这是付款额吗」。没有执行新查询。'}
function csv(s,filter={}){let rs=getRows(s,filter),head=['数据标识','统计月份','模拟单据号','部门','费用类型','审批完成日','金额（元）','金额（万元）','口径','快照时间'];let content=[head,...rs.map(r=>['合成模拟数据','2026-'+r.month,r.id,r.dept,r.type,r.date,r.amount,wan(r.amount),'审批已完成的报销费用；人民币含税；非付款额','2026-11-02 08:00'])].map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download=`财小智_2026-${s.month}_${s.dept}_${s.type||filter.type||filter.dept||'费用'}_模拟.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast(`已下载${rs.length}条记录，合计${wan(sum(rs))}万元。`)}
function showReport(s,origin){reportScope={...s};reportOrigin=origin;reportReply='';nav('report');window.scrollTo(0,0)}
function drillFrom(target,dim,name){if(target==='panel'){panelFilter={[dim]:name};panelTab='details';render();return}let s=target==='report'?reportScope:workScope;if(target==='work'&&workState!=='normal')return;let synthetic={id:null,scope:{...s},focus:dim==='dept'?'dept':'overview'};panel=synthetic;panelTab='details';panelFilter={[dim]:name};if(target==='report'||target==='work'){nav('chat');toast('已打开'+scopeName(s)+'的明细。')}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='scroll')e.preventDefault();if(a==='quick')ask(b.dataset.value);else if(a==='reset'){context={...DEFAULT};cards=[{id:++cardSequence,q:'10月集团报销费用是多少？比上个月变化大吗？',scope:{...DEFAULT},focus:'overview'}];panel=null;render()}else if(a==='open-panel'){let c=cards.find(x=>x.id===Number(b.dataset.card));openPanel(c)}else if(a==='close-panel')closePanel();else if(a==='panel-tab'){panelTab=b.dataset.value;if(panelTab==='details')panelFilter={};render()}else if(a==='panel-view'){panelView=b.dataset.value;render()}else if(a==='clear-drill'){panelFilter={};render()}else if(a==='drill'){drillFrom(b.dataset.target,b.dataset.dim,b.dataset.name)}else if(a==='apply-panel-scope'){let s={...panel.scope,month:document.getElementById('panel-month').value,dept:document.getElementById('panel-dept').value},focus=panel.focus;panel=null;appendCard('按新范围查看：'+scopeName(s),s,focus)}else if(a==='plan-card'){let c=cards.find(x=>x.id===Number(b.dataset.card));startPlan(c.scope,c.focus,'chat')}else if(a==='dismiss-plan'){plan=null;paintTask()}else if(a==='start-job'){beginJob()}else if(a==='cancel-job'){cancelJob()}else if(a==='retry-job'){retryJob()}else if(a==='open-job-report'){showReport(job.scope,'chat')}else if(a==='settings'){settingsOpen=!settingsOpen;renderSettings()}else if(a==='workspace-tab'){workTab=b.dataset.value;render()}else if(a==='work-dim'){workDim=b.dataset.value;render()}else if(a==='work-view'){workView=b.dataset.value;render()}else if(a==='workspace-reset'||a==='preset-query'){workScope={...DEFAULT};workDim='type';workTab='query';render()}else if(a==='restore-work'){workState='normal';render()}else if(a==='continue-chat'){panel=null;appendCard('继续分析：'+scopeName(workScope),workScope,workDim==='dept'?'dept':'overview');nav('chat')}else if(a==='work-report'){startPlan(workScope,workDim==='dept'?'dept':'overview','workspace')}else if(a==='work-basis'){panel={id:null,scope:{...workScope},focus:'overview'};panelTab='basis';panelFilter={};nav('chat')}else if(a==='save-query')saveQuery();else if(a==='load-query'){workScope={...saved[Number(b.dataset.index)]};render()}else if(a==='remove-query'){saved.splice(Number(b.dataset.index),1);persist();render()}else if(a==='open-report-item'){let r=reportItems.find(x=>x.id===b.dataset.id);showReport(r.scope,'workspace')}else if(a==='back-report'){if(reportOrigin==='workspace')workTab='reports';nav(reportOrigin==='workspace'?'workspace':'chat')}else if(a==='toggle-report-ask'){reportAskOpen=!reportAskOpen;render()}else if(a==='report-question'){reportReply=reportAnswer(b.dataset.value);render()}else if(a==='report-details'){panel={id:null,scope:{...reportScope},focus:'overview'};panelTab='details';panelFilter={};nav('chat')}else if(a==='scroll'){document.getElementById(b.dataset.to)?.scrollIntoView({behavior:'smooth',block:'start'})}else if(a==='csv-panel'){csv(panel.scope,panelTab==='details'?panelFilter:{})}else if(a==='csv-work'){if(workState==='normal')csv(workScope)}else if(a==='csv-report')csv(reportScope);else if(a==='print')window.print()});
document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();ask(document.getElementById('chat-input').value)}else if(e.target.id==='workspace-form'){e.preventDefault();let q=document.getElementById('workspace-input').value.trim(),base={...workScope,month:document.getElementById('work-month').value,dept:document.getElementById('work-dept').value};if(q){let p=parseIntent(q,base);if(!p||p.intent==='report'){toast('未执行查询。试试“10月销售部费用结构”或直接使用筛选。');return}workScope=p.scope;workDim=p.focus==='dept'?'dept':'type'}else workScope=base;workTab='query';render()}else if(e.target.id==='report-form'){e.preventDefault();let q=document.getElementById('report-input').value.trim();if(q){reportReply=reportAnswer(q);render()}}});
document.addEventListener('change',e=>{if(e.target.id==='demo-state'){workState=e.target.value;workTab='query';settingsOpen=false;nav('workspace')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(settingsOpen){settingsOpen=false;renderSettings()}else if(panel&&route==='chat')closePanel()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-action]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
window.demoApi=Object.freeze({total,getRows,cats,comparison,parseIntent,suggestionsFor,ask,appendCard,startPlan,beginJob,cancelJob,retryJob,advanceJob,getState:()=>JSON.parse(JSON.stringify({context,cards,panel,route,workScope,workState,plan,job,reportScope,reportItems,saved}))});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>

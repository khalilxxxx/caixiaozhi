(()=>{

function icon(name,size=16){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.info}"/></svg>`}

const fixedVersions=[['固定资产差异核验','1.2'],['固定资产差异核验','1.1'],['发票要素核对','1.0','invoice'],['费用报销辅助检查','0.9'],['月度费用归集','0.8'],['合同付款条款提取','2.0']];

function reset(scenario='normal'){

if(scenario==='limited'){Object.assign(state,{role:'admin',biz:'approved',tech:'approved',compat:'fail'});state.activity.unshift({text:'安全通过；财小智兼容性未通过',time:'10:26'});}

function statusBadge(status){return status==='approved'?'<span class="badge">已通过</span>':status==='returned'?'<span class="badge red">已退回</span>':'<span class="badge amber">待审核</span>'}

function render(){
$('#roleSelect').value=state.role;$('#topAvatar').textContent=roles[state.role].slice(0,1);$('#uploadCount').textContent=String(4+state.uploads.length-(state.invoiceDraftSubmitted?1:0)).padStart(2,'0');$('#reviewCount').textContent=String(3+state.uploads.length).padStart(2,'0');
$$('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===state.tab);b.setAttribute('aria-selected',b.dataset.tab===state.tab)});
$('#content').innerHTML=state.tab==='review'?reviewView():state.tab==='uploads'?uploadsView():permissionsView();bindContent();}
function changeTab(tab){state.tab=tab;render()}
function reviewView(){
return `<div class="workspace"><aside class="panel queue"><div class="queue-head"><h2>审核任务 <span style="font-size:10px;color:#a1ac93;font-weight:400;margin-left:5px">/ ${String(3+state.uploads.length).padStart(2,'0')}</span></h2><p>两条审核轨道，共同守护发布质量</p></div><div class="search">${icon('search',14)}<input id="queueSearch" placeholder="搜索技能名称" aria-label="搜索审核任务" value="${esc(state.queueSearch)}"></div><div id="queueItems">${queueItems()}</div><div class="queue-foot">${icon('info',13)}<span style="display:block;margin-top:7px">当前审核台使用固定 v1.2 示例。<br>作者不能审核自己提交的版本。</span></div></aside><section class="panel"><div class="detail-head"><div class="detail-kicker">FINANCE SKILL <span style="width:17px;height:1px;background:#cdd7c1"></span> 版本审核</div><div class="detail-title"><h2>固定资产差异核验</h2><div class="package-avatar">${icon('box',22)}</div></div><div class="detail-meta"><span>作者 林知微</span><span>v1.2</span><span>2026.11.15 · 09:42</span></div><div class="review-status-row"><div class="review-status"><span>业务审核</span>${statusBadge(state.biz)}</div><div class="review-status"><span>技术审核</span>${statusBadge(state.tech)}</div></div></div><div class="inner-tabs"><button class="inner-tab ${state.innerTab==='audit'?'active':''}" data-inner="audit">审核内容</button><button class="inner-tab ${state.innerTab==='metadata'?'active':''}" data-inner="metadata">申请资料</button><button class="inner-tab ${state.innerTab==='changes'?'active':''}" data-inner="changes">版本差异 <span style="font-size:9px;margin-left:3px">02</span></button></div><div class="detail-body">${detailBody()}</div><div class="review-foot">${icon('lock',12)} 每项结论独立记录，发布前将再次确认版本与受众</div></section><aside class="side">${releasePanel()}${audiencePanel()}</aside></div>`}
function queueItems(){const all=[{name:'固定资产差异核验',version:'1.2',author:'林知微',status:state.published?'已发布':state.biz==='returned'||state.tech==='returned'?'已退回':state.biz==='approved'&&state.tech==='approved'?'等待发布':'等待双轨审核',id:'main'},{name:'月度费用归集',version:'0.8',author:'顾南',status:'待补充材料',id:'monthly'},{name:'合同付款条款提取',version:'2.0',author:'沈青',status:'业务审已通过',id:'contract'},...state.uploads.map((x,i)=>({name:x.name,version:x.version,author:'林知微',status:'新提交 · 待双审',id:'upload-'+i}))];const filtered=all.filter(x=>x.name.includes(state.queueSearch));return filtered.length?filtered.map(x=>`<button class="queue-item ${x.id==='main'?'active':''}" data-queue="${x.id}"><span class="queue-title">${esc(x.name)}${x.id==='main'?icon('arrow',12):''}</span><span class="queue-meta">v${esc(x.version)} <span>·</span> ${esc(x.author)}</span><span class="queue-status"><span>${x.status}</span><span>${x.id==='main'?'当前':''}</span></span></button>`).join(''):'<div class="no-results">没有匹配的审核任务<br>试试“固定资产”</div>'}
function detailBody(){if(state.innerTab==='metadata')return `<div class="field-label">申请人说明</div><p class="review-description">核对资产台账与总账，识别原值、累计折旧与净值差异，输出可追溯的核验清单。申请在财小智对话中运行，由财务人员确认输入资料和结果。</p><dl class="summary-grid"><dt>技能名称</dt><dd>固定资产差异核验</dd><dt>申请版本</dt><dd>v1.2 · asset-reconciliation-v1.2.zip</dd><dt>业务分类</dt><dd>财务核算 / 固定资产</dd><dt>使用范围</dt><dd>财务部、财务业务伙伴</dd><dt>数据边界</dt><dd>仅使用当前对话中由用户提供的台账与总账</dd><dt>外部访问</dt><dd>无外部网络请求（示例声明）</dd></dl><div class="notice">${icon('info',16)}此处展示预设材料，不代表已执行真实安全扫描。</div>`;
if(state.innerTab==='changes')return `<div class="purpose-line"><div><strong>v1.1 → v1.2</strong><p class="purpose-sub">本次变更 2 项 · 材料由作者提交</p></div><span class="badge gray">固定示例</span></div><div class="diff-card"><h3>新增 · 差异定位</h3><p>增加按资产类别聚合的差异明细，输出资产编号、台账值、总账值与差异原因提示。</p></div><div class="diff-card"><h3>调整 · 结果格式</h3><p>统一金额保留两位小数；结果增加原始行号，便于回溯与复核。</p></div><p class="help">新版本会重新经过业务与技术审核。当前已发布的 v1.1 不受这次申请影响。</p>`;

function uploadsView(){const records=[...state.uploads.map((u,i)=>({...u,status:'待双轨审核',date:'刚刚',id:'upload-'+i,purpose:u.purpose==='run'?'财小智运行':'仅存储'})),{name:'固定资产差异核验',version:'1.2',status:state.published?'已发布':state.biz==='returned'||state.tech==='returned'?'已退回修改':'审核中',date:'2026.11.15',purpose:state.publishedPurpose==='store'&&state.published?'仅存储':'财小智运行',id:'main'},{name:'固定资产差异核验',version:'1.1',status:'已发布',date:'2026.11.08',purpose:'财小智运行',id:'history'},...(!state.invoiceDraftSubmitted?[{name:'发票要素核对',version:'1.0',status:'草稿',date:'2026.11.06',purpose:'仅存储',id:'draft'}]:[]),{name:'费用报销辅助检查',version:'0.9',status:'已退回修改',date:'2026.11.03',purpose:'财小智运行',id:'returned'}];return `<div class="upload-top"><div><h2>我的技能版本</h2><p class="muted">作者视角 · 林知微 &nbsp; / &nbsp; 每个版本保留独立的申请与审核状态</p></div><button class="btn primary" id="uploadBtn">${icon('plus',15)} 上传技能包</button></div><section class="panel table-wrap"><table class="data-table"><thead><tr><th>技能名称 / 版本</th><th>申请用途</th><th>当前状态</th><th>提交时间</th><th>操作</th></tr></thead><tbody>${records.map(r=>`<tr><td><div class="table-name"><div class="package-avatar">${icon('box',19)}</div><div>${esc(r.name)}<small>v${esc(r.version)}</small></div></div></td><td style="color:#849274;font-size:11px">${r.purpose}</td><td><span class="badge ${r.status.includes('退回')?'red':r.status.includes('审核')?'amber':r.status==='草稿'?'gray':''}">${r.status}</span></td><td style="font-size:11px;color:#94a087">${r.date}</td><td><button class="table-action" data-record="${r.id}">${r.id==='draft'?'继续编辑':r.id==='returned'?'查看意见':'查看详情'} →</button></td></tr>`).join('')}</tbody></table></section><div class="upload-guidance"><div class="guidance"><div class="guidance-num">01 / UPLOAD</div><h3>包文件与申请信息分开核对</h3><p>选择包文件，填写版本、用途与说明。演示仅识别文件名。</p></div><div class="guidance"><div class="guidance-num">02 / REVIEW</div><h3>两条轨道，独立审核</h3><p>业务与技术均通过后，进入发布确认；作者不能自审。</p></div><div class="guidance"><div class="guidance-num">03 / PUBLISH</div><h3>按具体版本确认受众</ function closeModal(){modal=false;$('#modalRoot').innerHTML='';document.body.style.overflow='';if(lastFocus?.isConnected)lastFocus.focus()}
function publishDialog(){if(state.role!=='admin'||state.biz!=='approved'||state.tech!=='approved'||state.security!=='pass')return;const limited=state.compat==='fail';openModal('确认发布此版本','请核对版本、用途与受众。发布动作仅在本页面模拟。',`${limited?`<div class="notice">${icon('info',16)}安全结论通过，但财小智兼容性未通过。禁止开放运行权限。</div>`:''}<dl class="summary-grid"><dt>技能 / 版本</dt><dd>固定资产差异核验 <strong>v1.2</strong></dd><dt>业务审核</dt><dd>已通过 · 周悦</dd><dt>技术安全</dt><dd>已通过 · 陈默</dd><dt>财小智兼容</dt><dd>${limited?'未通过 · 只允许仅存储发布':'已通过 · 允许申请运行'}</dd><dt>发布受众</dt><dd>财务部、财务业务伙伴</dd></dl><label class="publish-choice"><input type="radio" name="publishPurpose" value="${limited?'store':'run'}" checked><span><strong>${limited?'仅存储发布':'发布并开放已授权的财小智运行'}</strong><small>${limited?'保留可见与下载授权，所有用户组运行权限保持关闭。':'财务部可见 / 下载 / 运行；财务业务伙伴可见 / 运行，无下载权限。'}</small></span></label>${limited?'':`<label class="publish-choice" style="background:white"><input type="radio" name="publishPurpose" value="store"><span><strong>仅存储发布</strong><small>本版本全部运行权限关闭，保留拟定的可见与下载授权。</small></span></label>`}`,`<p>版本与受众确认后，本地模拟生效</p><div class="buttons"><button class="btn" id="cancelPublish">返回核对</button><button class="btn primary" id="confirmPublish">${icon('check',14)} 确认发布 v1.2</button></div>`);$('#cancelPublish').onclick=closeModal;$('#confirmPublish').onclick=()=>{const purpose=$('input[name="publishPurpose"]:checked').value;state.published=true;state.publishedVersion='1.2';state.publishedPurpose=purpose;state.effective=clone(originalPermissions);if(purpose==='store')state.effective.forEach(r=>r[2]=false);state.draft=clone(state.effective);state.pendingPermissions=null;log(`王宁确认发布 v1.2 · ${purpose==='store'?'仅存储':'财小智运行'}`);closeModal();render();toast(`v1.2 已${purpose==='store'?'仅存储':''}发布，受众为财务部与财务业务伙伴（本地模拟）`)}}
function permissionDialog(viewOnly=false){const changes=viewOnly?state.pendingPermissions.changes:permissionChanges(),expanding=changes.some(c=>c.add);openModal(viewOnly?'待审权限申请':expanding?'提交扩大权限申请':'确认收窄权限',`固定资产差异核验 · v${state.publishedVersion}`,`<div class="notice" style="${expanding?'':'background:#f3f8ee;border-color:#dce8cf;color:#6d8759'}">${icon(expanding?'clock':'shield',16)}${expanding?'扩大受众或新增能力需要重新审核；当前权限不会即时改变。':'本次仅收窄权限，确认后可立即生效，无需重新审核。'}</div><ul class="change-list">${changes.map(c=>`<li>${esc(c.group)} · ${c.cap}<span class="badge ${c.add?'amber':'gray'}">${c.add?'新增授权':'收回授权'}</span></li>`).join('')}</ul><p class="help">${expanding?'本次方案作为一项整体申请；包含的收窄项也会随申请待审。需要立即收窄时，请先还原新增项并单独保存。':'关闭可见会同步关闭该用户组的下载与运行。保存后立即展示本地模拟结果。'}</p>`,`<p>所有变更仅作用于当前演示</p><div class="buttons"><button class="btn" id="cancelPerm">${viewOnly?'关闭':'返回修改'}</button>${viewOnly?'':`<button class="btn primary" id="confirmPerm">${expanding?'提交重新审核':'确认即时生效'}</button>`}</div>`);$('#cancelPerm').onclick=closeModal;if($('#confirmPerm'))$('#confirmPerm').onclick=()=>{if(expanding){state.pendingPermissions={changes:clone(changes),draft:clone(state.draft)};state.draft=clone(state.effective);log('发布管理员提交扩大授权申请，待重新审核')}else{state.effective=clone(state.draft);log('发布管理员收窄权限，已即时生效')}closeModal();render();toast(expanding?'权限申请已进入待审；现有受众与权限保持生效':'权限已收窄并立即生效（本地模拟）')}}
function viewRecord(id){if(id==='main'){state.tab='review';state.innerTab='metadata';render();return}if(id==='draft'){if(state.invoiceDraftSubmitted){toast('该草稿已提交，请查看新提交的申请');return}openWizard();wizard.sourceDraft='invoice';wizard.file='invoice-check-v1.0.zip';wizard.name='发票要素核对';wizard.version='1.0';wizard.description='核验发票的基础要素与金额信息。';wizard.purpose='store';wizard.step=2;renderWizard();return}let title,body;if(id.startsWith('upload-')){const u=state.uploads[Number(id.split('-')[1])];if(!u)return;title='新提交的技能申请';body=`<dl class="summary-grid"><dt>技能名称</dt><dd>${esc(u.name)}</dd><dt>版本</dt><dd>v${esc(u.version)}</dd><dt>文件名</dt><dd>${esc(u.file)}</dd><dt>申请用途</dt><dd>${u.purpose==='run'?'申请财小智运行':'仅存储'}</dd><dt>用途说明</dt><dd>${esc(u.description)}</dd><dt>受众</dt><dd>${u.grants.map((r,i)=>r[0]?groups[i]:null).filter(Boolean).join('、')}</dd><dt>审核状态</dt><dd><span class="badge amber">待业务审 / 待技术审</span></dd></dl><p class="help">此申请仅存在于当前页面。审核流程的完整交互请使用固定的「固定资产差异核验 v1.2」示例。</p>`}else if(id==='returned'){title='退回意见';body='<span class="badge red">费用报销辅助检查 v0.9 · 已退回</span><dl class="summary-grid"><dt>审核人</dt><dd>陈默 · 技术审核员</dd><dt>退回原因</dt><dd>请补充输入字段说明，并明确缺失数据时的处理方式。</dd><dt>下一步</dt><dd>修改材料后，创建新版本重新提交双轨审核。</dd></dl>'}else if(id==='history'){title='已发布版本';body='<span class="badge">固定资产差异核验 v1.1 · 已发布</span><dl class="summary-grid"><dt>发布时间</dt><dd>2026.11.08</dd><dt>业务审核</dt><dd>周悦 · 已通过</dd><dt>技术审核</dt><dd>陈默 · 安全通过、兼容通过</dd><dt>发布范围</dt><dd>财务部、财务业务伙伴</dd></dl>'}else{title=id==='monthly'?'月度费用归集 · v0.8':'合同付款条款提取 · v2.0';body=`<span class="badge ${id==='monthly'?'amber':''}">${id==='monthly'?'待补充材料':'业务审核已通过'}</span><p class="audit-info" style="margin-top:18px">${id==='monthly'?'作者顾南正在补充业务用途与数据范围说明。补齐材料后再进入审核。':'业务审核已确认使用场景，正在等待技术审核员分别判断安全与兼容性。'}</p><p class="help">这是一条只读示例记录。完整双轨审核交互位于「固定资产差异核验 v1.2」。</p>`}openModal(title,'申请详情 · 示例数据',body,'<p>此处不调用任何真实审核服务</p><div class="buttons"><button class="btn primary" id="closeRecord">知道了</button></div>');$('#closeRecord').onclick=closeModal}
function openWizard(){wizard={step:1,file:'',name:'',version:'1.3',description:'',purpose:'run',grants:clone(originalPermissions)};renderWizard()}
function openRevisionWizard(){if(state.role!=='author'||!versionLocked())return;openWizard();wizard.name='固定资产差异核验';wizard.version='1.3';wizard.description='根据 v1.2 的退回意见修订材料，核对资产台账与总账，输出可追溯的核验清单。';renderWizard()}
function renderWizard(){const steps=`<div class="steps">${['选择文件','填写信息','授权与提交'].map((s,i)=>`<div class="wizard-step ${wizard.step===i+1?'active':''}"><span>${i+1}</span>${s}</div>`).join('')}</div>`;let body='';if(wizard.step===1)body=`<div class="dropzone" id="dropzone"><div class="drop-icon">${icon('upload',25)}</div><h3>把技能包拖到这里</h3><p>支持 .zip 文件 · 本地演示仅识别文件名</p><button class="btn primary" id="chooseFile">${icon('plus',14)} 选择文件</button><button class="btn quiet" id="loadExample">载入示例包</button><input type="file" id="fileInput" accept=".zip" hidden></div>${wizard.file?`<div class="selected-file">${icon('file',23)}<div><strong>${esc(wizard.file)}</strong><small>已选择 · 尚未上传或扫描</small></div><button class="icon-btn" id="removeFile" aria-label="移除已选择文件">${icon('close',14)}</button></div>`:''}<p class="help" style="margin-top:16px">文件内容不会被读取或发送。页面不会执行真实解压、安全扫描、兼容性检查或上传。</p>`;
if(wizard.step===2)body=`<div class="form-grid"><label class="form-field"><span>技能名称 *</span><input id="skillName" maxlength="40" placeholder="例如：固定资产差异核验" value="${esc(wizard.name)}"></label><label class="form-field"><span>版本号 *</span><input id="skillVersion" maxlength="20" placeholder="1.3" value="${esc(wizard.version)}"></label></div><label class="form-field"><span>用途与范围说明 *</span><textarea id="skillDescription" maxlength="500" placeholder="说明技能能解决什么问题、需要哪些输入以及适用范围">${esc(wizard.description)}</textarea></label><div class="form-field"><span>本次申请用途 *</span><div class="purpose-options"><label class="purpose-option"><input type="radio" name="purpose" value="store" ${wizard.purpose==='store'?'checked':''}><span><strong>仅存储</strong><small>归档与分享技能材料，不在财小智运行。</small></span></label><label class="purpose-option"><input type="radio" name="purpose" value="run" ${wizard.purpose==='run'?'checked':''}><span><strong>申请财小智运行</strong><small>额外判断兼容性，通过后才可授予运行。</small></span></label></div></div>`;
if(wizard.step===3)body=`<div class="purpose-line"><div><strong>${esc(wizard.name)} <span style="font-size:11px;color:#a0ab91">v${esc(wizard.version)}</span></strong><p class="purpose-sub">${esc(wizard.file)}</p></div><span class="badge ${wizard.purpose==='run'?'dark':'gray'}">${wizard.purpose==='run'?'申请财小智运行':'仅存储'}</span></div><div class="field-label">拟授权受众 · 发布前会再次确认</div><table class="wizard-table"><thead><tr><th>用户组</th><th>可见</th><th>下载</th><th>运行</th></tr></thead><tbody>${groups.map((g,i)=>`<tr><td>${g}</td>${[0,1,2].map(j=>`<td><input type="checkbox" data-grant="${i},${j}" aria-label="${g} ${capNames[j]}" ${wizard.grants[i][j]?'checked':''} ${j===2&&wizard.purpose==='store'?'disabled':''}></td>`).join('')}</tr>`).join('')}</tbody></table><p class="help">可见、下载、运行分别授权；开启运行不会自动开启下载。${wizard.purpose==='store'?'本次仅存储申请，运行权限已关闭。':'运行还需安全与财小智兼容性结论均通过。'}</p><div class="notice" style="margin:18px 0 0">${icon('shield',16)}提交后进入业务审与技术审，作者不能自审；双审通过后才可发布。</div>`;
openModal('上传一个新版本','作者 · 林知微 / 资料越完整，审核越清晰。',steps+body+'<div class="error" id="wizardError" role="alert" hidden></div>',`<p>步骤 ${wizard.step} / 3 · 仅浏览器本地模拟</p><div class="buttons"><button class="btn" id="wizardBack">${wizard.step===1?'取消':'上一步'}</button><button class="btn primary" id="wizardNext">${wizard.step===3?'提交双轨审核':'下一步'} ${icon('arrow',13)}</button></div>`,true);
$('#wizardBack').onclick=()=>{captureWizard();if(wizard.step===1)closeModal();else{wizard.step--;renderWizard()}};$('#wizardNext').onclick=nextWizard;
if(wizard.step===1){$('#chooseFile').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>selectFile(e.target.files[0]);$('#loadExample').onclick=()=>{wizard.file='asset-reconciliation-v1.3.zip';wizard.name='固定资产差异核验';wizard.description='核对资产台账与总账，识别差异并输出可追溯的核验清单。仅处理用户提供的财务资料。';renderWizard();toast('示例包已载入；仅预设文件名与申请信息')};if($('#removeFile'))$('#removeFile').onclick=()=>{wizard.file='';renderWizard()};const zone=$('#dropzone');zone.ondragover=e=>{e.preventDefault();zone.classList.add('dragover')};zone.ondragleave=()=>zone.classList.remove('dragover');zone.ondrop=e=>{e.preventDefault();zone.classList.remove('dragover');selectFile(e.dataTransfer.files[0])};}
if(wizard.step===3)$$('[data-grant]').forEach(input=>input.onchange=()=>{const[i,j]=input.dataset.grant.split(',').map(Number);wizard.grants[i][j]=input.checked;if(j===0&&!input.checked){wizard.grants[i][1]=false;wizard.grants[i][2]=false}if(j>0&&input.checked)wizard.grants[i][0]=true;renderWizard()})}
function selectFile(file){if(!file)return;if(!/\.zip$/i.test(file.name)){wizardError('请选择 .zip 格式的技能包。当前文件没有被载入。');return}wizard.file=file.name;renderWizard();toast('已识别本地文件名，未读取或上传文件内容')}
function captureWizard(){if(wizard.step===2){wizard.name=$('#skillName').value.trim();wizard.version=$('#skillVersion').value.trim().replace(/^v/i,'');wizard.description=$('#skillDescription').value.trim();wizard.purpose=$('input[name="purpose"]:checked').value;if(wizard.purpose==='store')wizard.grants.forEach(r=>r[2]=false)}}
function wizardError(text){$('#wizardError').textContent=text;$('#wizardError').hidden=false}
function normalizedVersion(version){const match=String(version).trim().replace(/^v/i,'').match(/^([\d.]+)(.*)$/);if(!match)return '';const parts=match[1].split('.').map(part=>part.replace(/^0+(?=\d)/,''));while(parts.length<3)parts.push('0');return parts.join('.')+match[2]}
function duplicateVersion(){const name=wizard.name.trim(),version=normalizedVersion(wizard.version);return [...fixedVersions.filter(([, ,draftId])=>draftId!=='invoice'||(!state.invoiceDraftSubmitted&&wizard.sourceDraft!=='invoice')),...state.uploads.map(u=>[u.name,u.version])].some(([existingName,existingVersion])=>existingName.trim()===name&&normalizedVersion(existingVersion)===version)}
function nextWizard(){captureWizard();if(wizard.step===1&&!wizard.file){wizardError('请先选择一个 .zip 文件，或载入示例包。');return}if(wizard.step>=2){if(!wizard.name||!wizard.description){wizardError('请完整填写技能名称与用途说明。');return}if(!/^\d+(\.\d+){1,2}(-[a-zA-Z0-9.-]+)?$/.test(wizard.version)){wizardError('请输入有效版本号，例如 1.3 或 1.3.0。');return}if(duplicateVersion()){if(wizard.step!==2){wizard.step=2;renderWizard()}wizardError(`「${wizard.name}」v${wizard.version} 已存在，请改用新的版本号；1.2 与 1.2.0 视为同一版本。已填写的资料已保留。`);$('#skillVersion').focus();return}}if(wizard.step<3){wizard.step++;renderWizard();return}if(!wizard.grants.some(r=>r[0])){wizardError('请至少选择一个可见的用户组，明确本次发布受众。');return}state.uploads.unshift(clone(wizard));if(wizard.sourceDraft==='invoice')state.invoiceDraftSubmitted=true;log(`林知微提交 ${wizard.name} v${wizard.version}`);state.tab='review';state.role='author';closeModal();render();toast('申请已进入待双轨审核，作者不能自审（本地模拟）')}
$('#roleIcon').innerHTML=icon('people',18);$('#scenarioLabel').innerHTML=icon('spark',13)+'演示案例';$('#resetBtn').innerHTML=icon('refresh',12)+'重置当前案例';$('#localNotice').innerHTML=icon('lock',11)+'所有操作仅在当前页面模拟';
$('#roleSelect').onchange=e=>switchRole(e.target.value);$$('[data-tab]').forEach(b=>b.onclick=()=>changeTab(b.dataset.tab));$$('[data-scenario]').forEach(b=>b.onclick=()=>{closeModal();reset(b.dataset.scenario);toast('案例已载入，可切换角色体验完整流程')});$('#resetBtn').onclick=()=>{reset(state.scenario);toast('当前案例已重置，模拟操作记录已清除')};
document.addEventListener('keydown',e=>{if(!modal)return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const focusables=[...$('.modal').querySelectorAll('button:not(:disabled),input:not([hidden]):not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]')].filter(el=>el.offsetParent!==null);if(!focusables.length)return;const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
reset();
})();
</script>

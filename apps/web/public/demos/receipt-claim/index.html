<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f9fb" />
    <title>回单认领 · 财小智</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./receipt-pdf.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <img src="../../agent-assets/caixiaozhi.png" alt="" width="34" height="34" />
          <span>财小智</span>
        </div>
        <span class="environment">演示环境</span>
      </div>
    </header>

    <main>
      <h1>回单认领</h1>

      <form class="query-form" aria-label="回单查询" novalidate>
        <div class="field">
          <label for="order-number">单号</label>
          <input
            id="order-number"
            name="orderNumber"
            type="text"
            placeholder="请输入单号"
            maxlength="40"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            required
          />
          <span class="field-error" id="order-error" hidden></span>
        </div>
        <div class="field">
          <label for="amount">金额</label>
          <div class="amount-field">
            <span aria-hidden="true">¥</span>
            <input
              id="amount"
              name="amount"
              type="text"
              inputmode="decimal"
              placeholder="0.00"
              autocomplete="off"
              required
            />
          </div>
          <span class="field-error" id="amount-error" hidden></span>
        </div>
        <button class="button primary query-button" type="submit">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="10.8" cy="10.8" r="6.3" />
            <path d="m16 16 4 4" />
          </svg>
          <span id="query-label">查询回单</span>
        </button>
      </form>

      <section class="results" aria-labelledby="results-title">
        <div class="section-heading">
          <h2 id="results-title">查询结果</h2>
          <span class="result-count" id="result-count" hidden>1 份样本回单</span>
        </div>

        <div class="results-surface" id="results-surface">
          <div class="result-state" id="result-state">
            <div class="state-icon" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <path d="M17 26H8a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h9l5 5v4M17 5v5h5M10 13h7m-7 5h4" />
                <circle cx="22" cy="21" r="4.2" />
                <path d="m25 24 3 3" />
              </svg>
            </div>
            <p id="state-text">暂无查询结果</p>
          </div>

          <article class="receipt" id="receipt" hidden>
            <div class="file-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M13.5 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9.5L13.5 3Z" />
                <path d="M13 3v6a1 1 0 0 0 1 1h6M8 14h8m-8 3h5" />
              </svg>
            </div>
            <div class="receipt-details">
              <h3>银行电子回单<span class="file-type">PDF</span></h3>
              <dl class="receipt-meta">
                <div><dt>单号</dt><dd id="receipt-order"></dd></div>
                <div><dt>金额</dt><dd id="receipt-amount"></dd></div>
              </dl>
            </div>
            <div class="receipt-actions">
              <a class="button secondary" id="preview" target="_blank" rel="noopener">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M2.1 12s3.6-5.5 9.9-5.5S21.9 12 21.9 12s-3.6 5.5-9.9 5.5S2.1 12 2.1 12Z" />
                  <circle cx="12" cy="12" r="2.5" />
                </svg>
                <span>预览</span>
              </a>
              <a class="button secondary" id="download">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M12 3.5v11m-4-4 4 4 4-4M5 16.5v3a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3" />
                </svg>
                <span>下载 PDF</span>
              </a>
            </div>
          </article>
        </div>
        <p role="status" class="visually-hidden" id="query-announcement"></p>
      </section>
    </main>

    <button class="guide-trigger" id="guide-trigger" type="button" popovertarget="guide">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1.1.8-1.5 1.1-1.5 2.3m0 3h.01" />
      </svg>
      使用指引
    </button>

    <aside class="guide" id="guide" popover aria-labelledby="guide-title">
      <div class="guide-header">
        <h2 id="guide-title">使用指引</h2>
        <button class="icon-button" type="button" popovertarget="guide" popovertargetaction="hide" aria-label="关闭使用指引" autofocus>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <p>填写单号和金额后查询。样本回单可预览和下载。</p>
      <dl class="guide-example">
        <div><dt>示例单号</dt><dd>FK-20261121-0024</dd></div>
        <div><dt>示例金额</dt><dd>¥12,580.00</dd></div>
      </dl>
      <button class="button secondary" id="use-example" type="button">填入示例</button>
    </aside>
  </body>
</html>

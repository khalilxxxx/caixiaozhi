<!doctype html>
<html lang="zh-CN">

      <a href="#chat" class="new-chat" data-nav="chat"><span data-icon="plus"></span>新建对话</a>

        <a href="#mine" data-nav="mine" aria-label="我创建的"><span data-icon="folder"></span><span>我创建的</span></a>
        <a href="#reviews" data-nav="reviews" aria-label="审核管理"><span data-icon="shield"></span><span>审核管理</span><span id="review-count" class="nav-count"></span></a>

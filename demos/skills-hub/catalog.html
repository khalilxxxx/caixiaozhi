function downloadSkill(){const s=getSelected();if(!canDownload(s)){requestPermission('download');return}const blob=new Blob([fileContents(s)],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`${s.id}-EXAMPLE-SKILL.md`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已生成并下载示例 SKILL.md 文件')}
function showInfo(title,subtitle,body){$('infoTitle').textContent=title;$('infoSubtitle').textContent=subtitle;$('infoBody').innerHTML=body;$('infoDialog').showModal()}
function explainCapability(){const s=getSelected();if(s.type==='storage')showInfo('这是一份存储型技能',s.name,`<div class="dialog-note">「已上架」表示资产已经可被发现和查阅；「仅存储」表示目前提供文件管理与参考用途。</div><p class="detail-summary">当前未设置运行入口，所以不会出现在可直接运行的技能中。你可以下载示例文件，查看其结构与内容。</p><button class="primary-btn" id="dialogDownload">${icon('download')}下载示例文件</button>`);else showInfo('运行适配尚未完成',s.name,`<div class="dialog-note">此技能已通过内容审核并上架，但还不能在对话中运行。下载权与运行就绪状态分别管理。</div><ol class="steps"><li><span class="step-number">1</span><span>待确认：输入字段、数据类型与校验规则。</span></li><li><span class="step-number">2</span><span>待完成：执行依赖配置与隔离验证。</span></li><li><span class="step-number">3</span><span>适配通过后，再按角色授予运行权限。</span></li></ol><p class="form-footnote" style="margin-top:18px">以上为合成适配状态，原型不会创建或部署执行环境。</p><a href="governance.html" class="primary-btn">查看审核与权限 ${icon('arrow')}</a>`)}
$('searchInput').addEventListener('input',e=>{state.query=e.target.value.trim();renderCards()});
$('clearSearch').addEventListener('click',()=>{state.query='';$('searchInput').value='';renderCards();$('searchInput').focus()});
$('favoritesFilter').addEventListener('click',()=>{state.favoritesOnly=!state.favoritesOnly;renderCards()});
$('runnableOnly').addEventListener('change',e=>{state.onlyRunnable=e.target.checked;renderCards()});
$('sortSelect').addEventListener('change',e=>{state.sort=e.target.value;renderCards()});
$('categories').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;state.category=b.dataset.category;renderCards()});
$('roleSelect').addEventListener('change',e=>{state.role=e.target.value;if(!visibleSkills().some(s=>s.id===state.selected)){state.selected='monthly-expense';state.tab='overview'}renderAll();notify(`已切换为${roleName()}：展示此身份可见的技能与权限`)});
document.addEventListener('click',e=>{
 const select=e.target.closest('[data-select]');if(select){state.selected=select.dataset.select;state.tab='overview';renderAll();if(window.innerWidth<=720){$('detailPanel').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});$('detailName').focus({preventScroll:true})}return}
 const favorite=e.target.closest('[data-favorite]');if(favorite){const id=favorite.dataset.favorite;const wasCard=Boolean(favorite.closest('.skill-card'));toggleFavorite(id);const restored=wasCard?document.querySelector(`.skill-card [data-favorite="${id}"]`):document.querySelector(`.detail-actions [data-favorite="${id}"]`);if(restored)restored.focus({preventScroll:true});return}
 const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;renderDetail();$(`tab-${state.tab}`).focus({preventScroll:true});return}
 const request=e.target.closest('[data-request]');if(request){requestPermission(request.dataset.request);return}
 const preview=e.target.closest('[data-preview]');if(preview){const s=getSelected();if(!canDownload(s)){requestPermission('download');return}showInfo(preview.dataset.preview==='manifest'?'manifest.json':'SKILL.md',`${s.name} · 合成示例源文件`,`<pre class="file-preview">${escapeHtml(fileContents(s,preview.dataset.preview))}</pre><p class="form-footnote" style="margin:13px 0 0">此预览与下载文件均为前端合成内容。</p>`);return}
 if(e.target.closest('[data-close-dialog]')){e.target.closest('dialog').close();return}
 if(e.target.closest('#resetFilters'))resetFilters();
 if(e.target.closest('#downloadSkill')||e.target.closest('#dialogDownload'))downloadSkill();
 if(e.target.closest('#explainCapability'))explainCapability();
 if(e.target.closest('#backToSkills')){$('searchInput').scrollIntoView({behavior:'smooth',block:'center'});$('searchInput').focus({preventScroll:true})}
});
$('requestForm').addEventListener('submit',e=>{e.preventDefault();const s=visibleSkills().find(s=>s.id===pendingSkillId);const kind=new FormData(e.target).get('permission');if(!s||!['run','download'].includes(kind))return;requests[requestKey(s,kind)]={skill:s.id,role:state.role,type:kind,reason:$('requestReason').value.trim(),createdAt:new Date().toISOString(),status:'pending-local'};const saved=storage.set('cxz-review-requests-v1',requests);$('requestDialog').close();state.tab='permissions';renderDetail();notify(saved?'申请已在本地记录，尚未发送或授予权限':'申请已暂存；当前浏览器无法保存，刷新后会重置')});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!document.querySelector('dialog[open]')){e.preventDefault();$('searchInput').focus()}if(e.target.matches('.detail-tab')&&['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();const tabs=['overview','files','permissions'];const index=tabs.indexOf(state.tab);state.tab=e.key==='Home'?tabs[0]:e.key==='End'?tabs[2]:tabs[(index+(e.key==='ArrowRight'?1:2))%3];renderDetail();$(`tab-${state.tab}`).focus()}});
renderAll();
</script>
</body>
</html>
